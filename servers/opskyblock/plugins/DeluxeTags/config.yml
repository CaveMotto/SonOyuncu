# DeluxeTags version: 1.8.2-Release Main Configuration
# 
# Create your tags using the following format:
# 
# deluxetags:
#   VIP: 
#     order: 1
#     tag: '&7[&eVIP&7]'
#     description: 'This tag is awarded by getting VIP'
# 
# Placeholders for your chat plugin that supports PlaceholderAPI (Including DeluxeChat)
# 
# %deluxetags_identifier% - display the players active tag identifier
# %deluxetags_tag% - display the players active tag
# %deluxetags_description% - display the players active tag description
# %deluxetags_amount% - display the amount of tags a player has access to
# 
# Placeholders for your essentials/chat handling formats config:
# 
# {deluxetags_identifier} - display the players active tag identifier
# {deluxetags_tag} - display the players active tag
# {deluxetags_description} - display the players active tag description
# {deluxetags_amount} - display the amount of tags a player has access to
force_tags: false
check_updates: true
legacy_hex: false
papi_chat: false
format_chat:
  enabled: false
  format: '{deluxetags_tag} <%1$s> %2$s'
load_tag_on_join: true
gui:
  name: '&6Available tags&f: &6%deluxetags_amount%'
  tag_select_item:
    material: NAME_TAG
    data: 0
    displayname: '&6Tag&f: &6%deluxetags_identifier%'
    lore:
    - '%deluxetags_tag%'
    - '%deluxetags_description%'
  divider_item:
    material: BLACK_STAINED_GLASS_PANE
    data: 0
    displayname: ''
    lore: []
  has_tag_item:
    material: PLAYER_HEAD
    data: 0
    displayname: '&eCurrent tag&f: &6%deluxetags_identifier%'
    lore:
    - '%deluxetags_tag%'
    - Click to remove your current tag
  no_tag_item:
    material: PLAYER_HEAD
    data: 0
    displayname: '&cYou don''t have a tag set!'
    lore:
    - '&7Click a tag above to select one!'
  exit_item:
    material: IRON_DOOR
    data: 0
    displayname: '&cClick to exit'
    lore:
    - '&7Exit the tags menu'
  next_page:
    material: PAPER
    data: 0
    displayname: '&6Next page: %page%'
    lore:
    - '&7Move to the next page'
  previous_page:
    material: PAPER
    data: 0
    displayname: '&6Previous page: %page%'
    lore:
    - '&7Move to the previous page'
deluxe_chat: false
deluxetags:
  skybasic:
    order: 1
    tag: skybasic
    description: '&8SkyBasic'
    permission: deluxetags.tag.skybasic
  skyold:
    order: 2
    tag: skyold
    description: '&aSkyOld'
    permission: deluxetags.tag.skyold
  skynew:
    order: 3
    tag: skynew
    description: '&bSkyNew'
    permission: deluxetags.tag.skynew
  skyarmy:
    order: 4
    tag: skyarmy
    description: '&eSkyArmy'
    permission: deluxetags.tag.skyarmy
  skycaptain:
    order: 5
    tag: skycaptain
    description: '&6SkyCaptain'
    permission: deluxetags.tag.skycaptain
  skywarrant:
    order: 6
    tag: skywarrant
    description: '&3SkyWarrant'
    permission: deluxetags.tag.skywarrant
  skyairman:
    order: 7
    tag: skyairman
    description: '&dSkyAirman'
    permission: deluxetags.tag.skyairman
  skyking:
    order: 8
    tag: skyking
    description: '&cSkyKing'
    permission: deluxetags.tag.skyking
  skypro:
    order: 9
    tag: skyking
    description: '&5SkyPro'
    permission: deluxetags.tag.skypro
  skychef:
    order: 10
    tag: skyking
    description: '&2SkyChef'
    permission: deluxetags.tag.skychef
