database:
  #Database backend type, can be set to mysql or sqlite
  type: sqlite
  #MySQL database host
  mySQLHost: localhost
  #MySQL connection port number
  mySQLPort: 3306
  #MySQL database name
  mySQLDatabase: db
  #MySQL database user
  mySQLUser: root
  #MySQL user's password
  mySQLPassword: ""
  #MySQL table names
  tableNames:
    players: "players"

economyType: VAULT
shopMenuName: "&7Market"
shopMenuSize: 27
enableSellAll: true
enableBuyGUI: true
enableSellGUI: true
enableSellGUISellAll: true
returnToShop: true
quickBuySell: false
hideBuyPriceForUnbuyable: true
hideSellPriceForUnsellable: true
invertBuySell: false
maxEnchantments: 3
limitEnchantmentLevelDiff: false
enableAmountSelectionFix: true
allowAllSellAllStackSizes: false
roundPrices: none
disableMainMenu: false
useDifferentMessagesForFreeItems: true
capitalizeItemNames: true
priceModifiersType: BOTH
closeGuiAfterSellAll: false
itemStackSizeCappedAt:
  1:
    material: ENDER_PEARL
    size: 16
  2:
    material: SNOW_BALL
    size: 16
  3:
    material: SIGN
    size: 16
  4:
    material: EGG
    size: 16
  5:
    material: BUCKET
    size: 1

disableShopsInGamemodes:
  - ADVENTURE
  - SPECTATOR
disableShopsInWorlds: []
  
displayPriceModifiersInPercents: true

disableSudoWorldPermissionCheck: false

disableSudoShopPermissionCheck: false

shopItemLoreFormat:
  item:
    - "&7Alış Fiyatı &8► &a%buy%TL"
    - "&7Satış Fiyatı &8► &a%sell%TL"
  itemBuyGUI:
    - "&7Alış Fiyatı &8► &a%buy%TL"
  itemSellGUI:
    - "&7Satış Fiyatı &8► &a%sell%TL"
  itemSellGUISellAll:
    - "&7Hepsini &a%sell%TL &7fiyatını sat!"
  permission:
    - "&7Alış Fiyatı &8► &a%buy%TL"
  enchantment:
    - "&7Alış Fiyatı &8► &a%buy%TL"
  command:
    - "&7Alış Fiyatı &8► &a%buy%TL"

log:
  toConsole: false
  toFile: true
  formatDate: "yyyy/MM/dd HH:mm:ss"
  formatBuy: "%player%,  %shop% marketinden %price%⛁ fiyatına %amount% x %item% aldı."
  formatSell: "%player%,  %shop% marketine %price%⛁ fiyatına %amount% x %item% sattı."
  formatSellAll: "%player%,  %shop% marketine %price%⛁ fiyatına bütün %amount% x %item% sattı."

