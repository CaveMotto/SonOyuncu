  title: '&a'
  subtitle: '&a'
  actionbar: '&d%claim.owner.name% &7isimli oyuncunun claimine girdin.'
claim-leave:
  title: '&a'
  subtitle: '&a'
  actionbar: '&d%claim.owner.name% &7isimli oyuncunun claiminden çıktın.'
member-status-mode:
  active: 'Active'
  deactive: 'Deactive'


